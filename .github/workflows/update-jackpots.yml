name: Update Lottery Jackpots

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch current jackpot figures
        run: python scripts/update_jackpots.py

      - name: Commit updated data (if changed)
        run: |
          git config user.name "jackpot-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- data/jackpots.json; then
            echo "No change in jackpot figures."
          else
            git add data/jackpots.json
            git commit -m "Update jackpot figures [automated]"
            git push
          fi
